# inference-platform.yaml — CRI's GenAI inference lane.
# ADAPTED from the chapter reference sketch for Cornerstone Relief International.
#
# This is a TEACHING/DESIGN sketch, not a deploy-ready manifest. It shows the
# durable shape of CRI's serving stack and, more importantly, WHERE THE
# GOVERNANCE HOOKS ATTACH. Pin every image to a digest in production; the
# version lines below are mid-2026 snapshots and drift weekly — re-verify.
#
# What CRI changed from the reference, and why:
#   * TWO LANES, not one. A self-hosted RESTRICTED lane (case notes) and an API
#     lane (staff productivity, AIOps) on ONE control plane. The reference had
#     one lane; CRI's duty of care to beneficiaries forces the split.
#   * Sizing is 2xH100, derived from the KV-cache math in code/estate_cost.py,
#     not guessed. 24 concurrent x 8k context needs ~151 GB, not 70 GB.
#   * Explicit trust boundaries B1-B5 from security-plan.txt Part C.
#   * Owners named on every governance hook (EU AI Act Art. 14).

platform:
  organization: "Cornerstone Relief International"
  owner: daniel.okoro@cri.example.org
  security_owner: priya.raman@cri.example.org

  control_plane:
    kubernetes: ">=1.34"           # DRA (Dynamic Resource Allocation) GA in v1.34
    gpu_operator: "26.3.x"         # NVIDIA GPU Operator line; drivers + device plugins
    scheduler: "kueue + volcano"   # gang/queue scheduling for AI jobs
    gitops: "reconciled_from_git"  # every change is a PR with two-person review
    admission_control:
      require_signed_images: true
      require_digest_pinning: true # no floating tags anywhere in the cluster
      reject_unsigned: true

  # DRA replaces opaque `nvidia.com/gpu: 1` integer requests with declarative claims.
  resource_claim:
    deviceClassName: "gpu.nvidia.com"
    selectors:
      - product: "H100"
        count: 2                   # sized from estate_cost.py, NOT guessed:
                                   #   70.0 GB weights
                                   # + 64.4 GB KV cache (24 x 8k ctx, GQA)
                                   # + 16.1 GB runtime overhead
                                   # = 150.6 GB -> 2 x 80 GB
        partition: "full_card"     # NOT a MIG slice: the KV cache needs the VRAM.
                                   # MIG is right for many small models; it is
                                   # wrong for one 70B model with a long context.

  # =====================================================================
  # LANE A — RESTRICTED. Case-note RAG. Self-hosted. Never leaves CRI.
  # =====================================================================
  lane_restricted:
    purpose: "Case-note retrieval for authorised caseworkers (ai-strategy A6/W1)"
    data_class: restricted         # special-category personal data
    owner: miguel.santos@cri.example.org
    egress: "deny_all"             # no route to the internet. Not a policy — a route.

    serving:
      engine: "vllm"               # PagedAttention + continuous batching
      runtime: "kserve"            # canary + shadow built in
      model_source: "oci-artifact" # weights as OCI artifacts -> signed + scanned
      model_id: "PIN-ME@sha256:<digest>"   # pin the DIGEST. "latest" is banned.
      quantization: "fp8"
      max_model_len: 8192          # RAISING THIS RE-OPENS THE VRAM MATH.
                                   # KV cache is LINEAR in context: 16k doubles it
                                   # to ~129 GB and needs a third GPU. Nobody
                                   # changes this line without re-running
                                   # code/estate_cost.py. (cost-analysis §6, T2)
      max_num_seqs: 24             # peak concurrency the sizing assumes
      api: "openai-compatible"     # /v1/chat/completions — the lingua franca

    retrieval:
      index: "self_hosted_vector_store"
      embed_dim: 1024
      acl_filter: "pre_search"     # B2 — ACL applied BEFORE the vector search,
                                   # so retrieval can only surface documents this
                                   # caseworker may already read. Filtering after
                                   # search is a leak with extra steps.
      partitions:
        - name: internal
          provenance: internal     # CRI-authored case notes
        - name: external_quarantine
          provenance: external     # B1 — partner referrals, field intake PDFs.
          never_mixed_with: internal   # never in the same retrieval context
      scope_limit: "single_household_per_summarisation_request"

    injection_defenses:            # security-plan.txt Part C, boundaries B1-B5
      retrieved_content_is_data_not_instructions: true   # B3 (necessary, NOT sufficient)
      disable_tools_when_external_provenance_present: true  # B3 — Rule of Two:
                                   # untrusted input + sensitive access is allowed;
                                   # the third leg (tools/state change) is removed.
      render_model_markdown_images: false    # B4 — the zero-click exfil path
      autofetch_model_links: false           # B4
      ui_content_security_policy:            # B4
        img_src: ["'self'"]
        connect_src: ["'self'"]
      normalize_invisible_text_on_ingest: true   # detection aid only, will be bypassed
      retrieval_anomaly_alerting: true       # one source doc appearing across
                                             # unrelated queries = poisoned chunk

  # =====================================================================
  # LANE B — INTERNAL. Staff assistant + AIOps agent. Commercial API.
  # =====================================================================
  lane_api:
    purpose: "Staff productivity (W2) and AIOps reasoning (W3)"
    data_class: internal           # RESTRICTED data is FORBIDDEN on this lane
    owner: peter.novak@cri.example.org
    gateway: "openai-compatible-proxy"   # one seam; providers are swappable
    contractual_terms: "zero_data_retention"
    egress: "allowlist_only"       # B5 — DLP inspects POST bodies; consumer
                                   # chatbot domains blocked outright
    model_tiers:
      default: "small-fast-tier"   # classification, routing, short summaries
      escalation: "mid-tier"       # only when the small tier's confidence check fails
      frontier: "exception_only"   # requires grace.adeyemi@cri.example.org
    spend_cap_usd_per_day: 200     # HARD STOP, not an alert. owner: ruth.mensah
    rate_limits:
      per_user: enforced
      per_agent: enforced
      identical_call_loop_detector: enabled   # OWASP LLM10, unbounded consumption

  # =====================================================================
  # GOVERNANCE HOOKS — where policy attaches to the platform
  # =====================================================================
  governance_hooks:
    telemetry: "opentelemetry"          # one backbone: infra + app + model
    audit_log:
      target: "worm-bucket"             # EU AI Act Art. 12 logging target
      write_order: "before_execution"   # if the log write fails, the action does
                                        # not run. Logging is a PRECONDITION.
      retention_years: 7
      deletable_by_production_identity: false
      owner: priya.raman@cri.example.org
    agent_interop:
      protocol: "mcp"                   # agent-to-tool; A2A for agent-to-agent
      tool_allowlist: "enumerated_per_autonomy_rung"   # an 'observe' agent
                                        # cannot SEE a write tool in its list
      token_ttl_minutes: 60
    autonomy_policy: "./autonomy-ladder.yaml"
    aibom: "cyclonedx-ml-bom"           # per release; deploy blocked if absent
    model_registry: "oci_registry_with_model_cards"
    kill_switch:
      scope: "revokes_every_agent_token_and_disables_the_ladder"
      who_may_pull: "any_of_the_nine"   # no approval required to STOP
      tested: quarterly
      owner: priya.raman@cri.example.org

  observability:
    slo_ttft_p95_ms: 2000               # breach for 2 weeks -> add a 3rd GPU
    slo_availability: "99.5%"           # a nine-person team should not promise 99.99
    tracked_metrics:
      - retrieval_precision_on_held_out_question_set
      - refusal_and_low_confidence_rate
      - guardrail_trips
      - rollbacks_fired
      - rollbacks_that_failed          # target: 0
      - autonomy_demotion_events
      - restricted_data_egress_events  # target: 0

# Durable-standards bet (survives a rename or an acquisition): OpenTelemetry,
# OpenAI-compatible API, Open Inference Protocol, MCP/A2A, OCI artifacts,
# CycloneDX ML-BOM. Every product above is named as an IMPLEMENTATION of one of
# these interfaces. If the vendor is renamed tomorrow, the architecture stands.
