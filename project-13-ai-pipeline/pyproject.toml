# Lint config is pinned so the gate means the same thing on every machine and
# on every ruff release. An unpinned linter is a gate that changes silently.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle errors, pyflakes, import order
ignore = ["E501"]          # long lines in docstrings and rationale comments

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
